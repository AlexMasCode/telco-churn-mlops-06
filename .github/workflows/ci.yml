name: Telco Churn CI

on:
  push:
    branches: [main, "lab1/**", "lab2/**", "lab3/**"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: churn-api

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8 black pytest pytest-cov "pandera[pandas]"

      - name: Generate synthetic training dataset
        run: |
          mkdir -p data/raw
          python src/generate_dataset.py \
            --samples 5000 \
            --output data/raw/telco_train.csv

      - name: Lint (flake8)
        run: flake8 src/ tests/ --max-line-length 100

      - name: Format check (black)
        run: black --check src/ tests/

      - name: Unit tests
        run: pytest tests/unit -v --cov=src

  build-docker:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHA=${GITHUB_SHA::7}
          IMAGE=$REGISTRY/$OWNER/$IMAGE_NAME
          docker build -t $IMAGE:sha-$SHA .
          docker push $IMAGE:sha-$SHA
